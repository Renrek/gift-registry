services:
  php:
    container_name: gift-registry-php
    build:
      context: ./php
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    env_file:
      - ./app/.env.prod.local
    volumes:
      - ./app:/var/www/symfony_docker
    restart: unless-stopped

  nginx:
    container_name: gift-registry-nginx
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./app:/var/www/symfony_docker:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped
