name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, intl, pdo_mysql, zip
          coverage: none

      - name: Install Composer dependencies
        working-directory: app
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        working-directory: app
        run: ./scripts/phpstan.sh

      - name: Run PHPUnit
        working-directory: app
        run: ./scripts/phpunit.sh

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend assets
        working-directory: app
        run: npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-php, build-frontend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git submodule update --init --recursive
            docker run --rm \
              -v "$PWD/app:/app" \
              -w /app \
              node:22-alpine \
              sh -c 'npm ci && npm run build'
            docker compose -f docker-compose.prod.yml build php
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml exec -T php \
              composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
            docker compose -f docker-compose.prod.yml exec -T php \
              php bin/console cache:clear --env=prod --no-debug
            docker compose -f docker-compose.prod.yml exec -T php \
              php bin/console doctrine:migrations:migrate --no-interaction
            docker compose -f docker-compose.prod.yml ps
