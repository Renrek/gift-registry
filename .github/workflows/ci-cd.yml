name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, intl, pdo_mysql, zip
          coverage: none

      - name: Install Composer dependencies
        working-directory: app
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        working-directory: app
        run: ./scripts/phpstan.sh

  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, intl, pdo_mysql, zip
          coverage: none

      - name: Install Composer dependencies
        working-directory: app
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        working-directory: app
        run: ./scripts/phpunit.sh

  build-frontend:
    needs: [phpstan, phpunit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend assets
        working-directory: app
        run: npm run build

